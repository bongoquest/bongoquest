media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images

content:
  - name: posts
    label: Blog Posts
    path: posts
    type: collection
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: category
        label: Category
        type: select
        options:
          values:
            - Love & Relationships
            - Travel & Adventure
            - Life & Philosophy
            - Photography
            - Society & Opinions

      - name: image
        label: Featured Image
        type: image

      - name: description
        label: Short Description
        type: string

      - name: body
        label: Article
        type: rich-text